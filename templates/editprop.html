{% load static %}

{% include 'header.html' %}	
<link rel="stylesheet" href="{% static 'assets/css/register.css' %}">

<div class="register-page">
    <div class="register-header">
        <h1>EDIT PROPERTY</h1>
    </div>

    <div class="register-container">
        <form class="register-form" action="{% url 'edit_prop' id=prop.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group file-upload-group">
                <label for="photo" class="file-upload-label">
                    <span id="file-name">Change Property Photo (Optional)</span>
                    <input id="photo" name="property_photo" type="file" accept="image/*" class="file-input">
                </label>
                {% if prop.property_photo %}
                <div class="mt-2 text-center">
                    <small class="text-muted d-block">Current Photo:</small>
                    <img src="{{ prop.property_photo.url }}" alt="Property Photo" width="180" class="rounded mt-1" style="object-fit: cover; max-height: 120px;">
                </div>
                {% endif %}
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Category</label>
                <input name="property_category" type="text" value="{{ prop.property_category }}" placeholder="Category (e.g. Luxury Villa)" required>
            </div>
            
            <div class="form-group">
                <label class="form-label small text-muted">Property Name</label>
                <input name="property_name" type="text" value="{{ prop.property_name }}" placeholder="Property Name" required>
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Location</label>
                <input name="property_location" type="text" value="{{ prop.property_location }}" placeholder="Location" required>
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Budget / Price ($)</label>
                <input name="property_budget" type="text" value="{{ prop.property_budget }}" placeholder="Budget" required>
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Bedrooms</label>
                <input name="property_bedroom" type="text" value="{{ prop.property_bedroom }}" placeholder="Bedrooms" required>
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Bathrooms</label>
                <input name="property_bathroom" type="text" value="{{ prop.property_bathroom }}" placeholder="Bathrooms" required>
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Total Area</label>
                <input name="property_area" type="text" value="{{ prop.property_area }}" placeholder="Area (e.g. 250m2)" required>
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Floor Number</label>
                <input name="property_floor" type="text" value="{{ prop.property_floor }}" placeholder="Floor" required>
            </div>

            <div class="form-group">
                <label class="form-label small text-muted">Parking</label>
                <input name="property_parking" type="text" value="{{ prop.property_parking }}" placeholder="Parking (e.g. 2 spots)" required>
            </div>

            <div class="register-actions">
                <button id="submitbttn" type="submit" class="register-btn">
                    UPDATE PROPERTY
                </button>
            </div>
        </form>				
    </div>
</div>

{% include 'footer.html' %}
